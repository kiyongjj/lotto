<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lotto | 복권 추첨 서비스</title>

  <!-- SEO 기본 -->
  <meta name="description" content="로또 추첨, 회차별 당첨번호 조회 및 구매 시뮬레이션 서비스" />

  <!-- jQuery -->
  <script src="https://cdn.jsdelivr.net/jquery/latest/jquery.min.js"></script>

  <!-- 외부 JS / CSS (운영 환경에 맞게 경로 수정) -->
  <script defer src="/lotto/js/lotto_main.js"></script>
  <link rel="stylesheet" href="/lotto/css/lotto_main.css" />

</head>
<body>

  <!-- 상단 네비게이션 -->
  <header class="top-bar">
    <nav class="top-bar__menu-box-1">
      <ul>
        <li>
          <a href="./lotto_main.html">복권추첨</a>
          <a href="#">복권정보</a>
          <a href="#">당첨결과</a>
        </li>
      </ul>
    </nav>
  </header>

  <!-- 메인 콘텐츠 -->
  <main>

    <!-- 히어로 이미지 -->
    <img
      src="https://picsum.photos/960/300?random=1"
      alt="로또 추첨을 상징하는 이미지"
      class="hero-image"
    />

    <h1>LOTTO</h1>

    <!-- 회차 조회 -->
    <section>
      <h2>회차별 당첨번호 조회</h2>
      <div class="controls">
        <select id="roundNumber" onchange="chageRoundNumber()"></select>
        <button type="button" id="selectLottoNumber">당첨번호 조회</button>
        <button type="button" id="checkWinningHistory">당첨 이력 확인</button>
      </div>
    </section>

    <!-- 당첨번호 입력 -->
    <section>
      <h2>당첨번호 등록</h2>
      <div class="controls">
        <input type="number" id="roundNo" placeholder="회차" style="width: 80px" />
        <input type="text" id="lottoNumbers" placeholder="예: 1,3,5,7,9,11" style="width: 200px" />
        <input type="date" id="drawDate" />
        <button type="button" id="insertLottoNumber">로또 입력</button>
      </div>
    </section>

    <!-- 구매 시뮬레이션 -->
    <section>
      <h2>로또 구매</h2>
      <div class="controls">
        <input type="number" id="buyingCost" placeholder="구매금액" step="1000" />
        <button type="button" class="collectLottoNumbers" onclick="collectLottoNumbers()">구매</button>
      </div>
    </section>

    <!-- 결과 출력 영역 -->
    <section>
      <h2>결과</h2>
      <div id="lotto-container"></div>
    </section>

  </main>

</body>
</html>
