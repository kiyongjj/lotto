<!DOCTYPE html>
<html lang="ko">
	<head>
		<meta charset="UTF-8">
		<title>Lotto</title>
		<script type="text/javascript" src="https://cdn.jsdelivr.net/jquery/latest/jquery.min.js"></script>
		<script src="http://localhost:8081/lotto/js/lotto_main.js"></script>
		<link rel="stylesheet" href="http://localhost:8081/lotto/css/lotto_main.css">
	</head>
	<style>
		body, ul, li {
			margin: 0;
			padding: 0;
			list-style: none;
		}
		a {
			color: inherit;
			text-decoration: none;
			font-size: 2rem;
		}
		/* 변수 생성 */
		:root {
			--site-width: 800px;
			/*background: yellow;*/
		}
		/* 사이트 최소 너비 설정 */
		.con-min-width {
			min-width: var(--site-width);
		}
		body {
			width: var(--site-width);
		}
		/* 실질적으로 메뉴에 사용할 너비 설정 */
		.top-bar > .con {
			width: var(--site-width);
		}
		.top-bar__menu-box-1 {
			text-align: center;
			margin-top: 30px;
		}
		.first-menu {
			padding: 10px;
		}
	</style>
	<script>
		$('#purchaseTicket').click(function() {
			alert("TEST");
		});
	</script>
	<body>
		<header class='top-bar con-min-width'>
			<div>
				
			</div>
			<div class='con'>
				<nav class='top-bar__menu-box-1'>
					<ul>
						<li>
							<a class='first-menu' href="./lotto_main.html">복권추첨</a>
							<a class='first-menu' href="#">복권정보</a>
							<a class='first-menu' href="#">당첨결과</a>
						</li>
					</ul>
				</nav>
			</div>
		</header>
		<div>
			<h1>LOTTO</h1>
			<div>
				<select id='roundNumber' onchange='chageRoundNumber()'>
				</select>
				<button type='button' id='selectLottoNumber'>당첨번호 조회</button>
				<button type='button' id='testLottoNumber'>당첨번호 테스트</button>
			</div>
			<div>
				<input type='number' id='roundNo' style='width:50px'/>
				<input type='text' id='lottoNumbers' style='width:164px;'/>
				<input type='date' id='drawDate'/>
				<button type='button' id='insertLottoNumber'>로또 입력</button>
			</div>
			<div>
				<input type='number' id='buyingCost' style='width:100px;' step='1000'></input>
				<button type='button' class='buyingLottoTicket' onclick='buyingLottoTicket()'>구매</button>
			</div>
		</div>
		
		<!-- 테이블을 표시할 위치 -->
		<div id="lotto-container">
		</div>
		
	</body>
</html>
